<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,regular,500,600,700,800,900,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Countries</title>
  </head>
  <body>
    <header class="header">
      <h2 class="title"><a href="/">Where in the world?</a></h2>
      <p id="theme-changer">
        <i class="fa-regular fa-moon"></i>&nbsp;&nbsp;Dark Mode
      </p>
    </header>
    <main id="country-main">
      <div class="search-filter-container">
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            id="input-search"
            type="text"
            placeholder="Search for a country..."
          />
        </div>
        <select class="filter-by-region">
          <option value="Filter by Region" hidden>Filter by Region</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>
      <div class="countries-container"></div>
    </main>

    <main id="details-main" hidden>
      <button class="back-button">
        <i class="fa-solid fa-arrow-left-long"></i>&nbsp;&nbsp;Back
      </button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
